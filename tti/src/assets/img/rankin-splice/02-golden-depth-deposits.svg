<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#070b15"/></linearGradient><radialGradient id="glow"><stop stop-color="#22395a" stop-opacity=".55"/><stop offset="1" stop-color="#080d1b" stop-opacity="0"/></radialGradient></defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<ellipse cx="825" cy="80" rx="380" ry="260" fill="url(#glow)"/>
<text x="64" y="74" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="3">RANKIN SKELETAL SPLICE</text>
<text x="1016" y="74" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end">02 / 03</text>
<line x1="64" y1="100" x2="1016" y2="100" stroke="#263750" stroke-width="2"/>
<text x="64" y="158" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2.5">GOLDEN-DEPTH DEPOSITS</text>
<text x="64" y="222" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="700" text-anchor="start">A critical balance</text>
<text x="64" y="288" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="700" text-anchor="start">sets the growth.</text>
<text x="64" y="364" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Fibonacci cohort growth × golden-ratio depth → nearly constant deposits.</text>
<rect x="64" y="330" width="952" height="144" rx="24" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="96" y="378" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">DEPOSIT AT STAGE n</text>
<text x="96" y="432" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="650" text-anchor="start">ΔΠₙ = (Fₙ₊₂ − 1) φ⁻ⁿ</text>
<text x="864" y="421" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end">φ = (1 + √5) / 2</text>
<text x="64" y="532" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.8">THE DEPOSIT APPROACHES A CONSTANT</text>
<line x1="105" y1="855" x2="980" y2="855" stroke="#263750" stroke-width="2"/>
<line x1="105" y1="653.7653124999999" x2="980" y2="653.7653124999999" stroke="#f4ca68" stroke-width="2" stroke-dasharray="8 8"/>
<text x="984" y="641.7653124999999" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="end">limit c = φ²/√5 ≈ 1.17082</text>
<rect x="99" y="748.7754062500001" width="62" height="106.22459375" rx="12" fill="#27506a" stroke="none" stroke-width="1"/>
<text x="130" y="891" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">1</text>
<text x="130" y="731.7754062500001" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">0.618</text>
<rect x="236" y="723.6991875" width="62" height="131.3008125" rx="12" fill="#27506a" stroke="none" stroke-width="1"/>
<text x="267" y="891" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">2</text>
<text x="267" y="706.6991875" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">0.764</text>
<rect x="373" y="692.70325" width="62" height="162.29674999999997" rx="12" fill="#27506a" stroke="none" stroke-width="1"/>
<text x="404" y="891" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">3</text>
<text x="404" y="675.70325" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">0.944</text>
<rect x="510" y="679.46646875" width="62" height="175.53353124999998" rx="12" fill="#27506a" stroke="none" stroke-width="1"/>
<text x="541" y="891" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">4</text>
<text x="541" y="662.46646875" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.021</text>
<rect x="647" y="669.024546875" width="62" height="185.97545312499997" rx="12" fill="#27506a" stroke="none" stroke-width="1"/>
<text x="678" y="891" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">5</text>
<text x="678" y="652.024546875" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.082</text>
<rect x="784" y="663.43465625" width="62" height="191.56534375" rx="12" fill="#77d9e8" stroke="none" stroke-width="1"/>
<text x="815" y="891" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="middle">6</text>
<text x="815" y="646.43465625" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">1.115</text>
<text x="975" y="902" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="end">stage n</text>
<rect x="64" y="950" width="452" height="164" rx="22" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="96" y="991" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.5">MARGINAL DEPOSIT</text>
<text x="96" y="1043" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="650" text-anchor="start">ΔΠₙ → c</text>
<text x="96" y="1082" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Binet asymptotics; conditional on</text>
<text x="96" y="1106" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">the cohort and depth rules above.</text>
<rect x="536" y="950" width="480" height="164" rx="22" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="568" y="991" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.5">CUMULATIVE PROGRESS</text>
<text x="568" y="1043" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="650" text-anchor="start">Πₙ = c n + O(1)</text>
<text x="568" y="1082" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Linear accumulation follows from</text>
<text x="568" y="1106" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">deposits tending to a positive constant.</text>
<text x="64" y="1170" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.8">READ THE BOUNDARY</text>
<text x="64" y="1205" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450" text-anchor="start">Golden depth is a chosen critical balance—not evidence of a physical force.</text>
<line x1="64" y1="1270" x2="1016" y2="1270" stroke="#263750" stroke-width="2"/>
<text x="64" y="1310" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">MODEL CONSEQUENCE ≠ PHYSICAL EVIDENCE</text>
<text x="1016" y="1310" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="end">EGREGORA  ·  TTI</text>
</svg>