<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#070b15"/></linearGradient><radialGradient id="glow"><stop stop-color="#22395a" stop-opacity=".55"/><stop offset="1" stop-color="#080d1b" stop-opacity="0"/></radialGradient></defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<ellipse cx="825" cy="80" rx="380" ry="260" fill="url(#glow)"/>
<text x="64" y="74" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="3">RANKIN SKELETAL SPLICE</text>
<text x="1016" y="74" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end">01 / 03</text>
<line x1="64" y1="100" x2="1016" y2="100" stroke="#263750" stroke-width="2"/>
<text x="64" y="158" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2.5">THE COUNTING RULE</text>
<text x="64" y="222" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="700" text-anchor="start">One fork. Two paths.</text>
<text x="64" y="288" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="700" text-anchor="start">A Fibonacci input.</text>
<text x="64" y="364" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">A discrete bookkeeping model—not a derived biological or physical law.</text>
<rect x="64" y="330" width="952" height="210" rx="26" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="96" y="373" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">ONE STIPULATED FORK</text>
<path d="M135 435 H400" fill="none" stroke="#f4ca68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 435 C490 435 500 405 560 405 H700" fill="none" stroke="#f4ca68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M400 435 C490 435 500 482 560 482 H700" fill="none" stroke="#f18bb9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="435" r="11" fill="#f5f0e4"/>
<text x="730" y="413" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">continues</text>
<text x="730" y="490" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">returns</text>
<text x="96" y="516" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">The fork is assumed; the two routes are a diagram of the rule.</text>
<rect x="64" y="570" width="952" height="82" rx="18" fill="#142238" stroke="none" stroke-width="1"/>
<text x="96" y="604" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.8">MODEL INPUT</text>
<text x="96" y="634" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="650" text-anchor="start">mₙ = Fₙ</text>
<text x="455" y="621" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">new returners at stage n</text>
<text x="64" y="705" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">CONDITIONAL COUNTING THEOREM</text>
<rect x="64" y="730" width="952" height="124" rx="20" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="96" y="782" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="650" text-anchor="start">Pₙ = Σⱼ₌₁ⁿ mⱼ = Fₙ₊₂ − 1</text>
<text x="96" y="822" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Cumulative population, provided the Fibonacci cohort rule is adopted.</text>
<text x="64" y="904" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.8">POST-SEED CONVENTION</text>
<text x="80" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">stage n</text>
<text x="315" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">1</text>
<text x="427" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">2</text>
<text x="539" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">3</text>
<text x="651" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">4</text>
<text x="763" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">5</text>
<text x="875" y="979" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="middle">6</text>
<line x1="80" y1="998" x2="1000" y2="998" stroke="#263750" stroke-width="1"/>
<text x="80" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">new mₙ</text>
<text x="315" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text>
<text x="427" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text>
<text x="539" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text>
<text x="651" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">3</text>
<text x="763" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">5</text>
<text x="875" y="1046" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">8</text>
<line x1="80" y1="1065" x2="1000" y2="1065" stroke="#263750" stroke-width="1"/>
<text x="80" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">total Pₙ</text>
<text x="315" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">1</text>
<text x="427" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">2</text>
<text x="539" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">4</text>
<text x="651" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">7</text>
<text x="763" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">12</text>
<text x="875" y="1113" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">20</text>
<rect x="64" y="1160" width="952" height="76" rx="16" fill="#251c31" stroke="none" stroke-width="1"/>
<text x="92" y="1192" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.4">WHAT THIS DOES NOT SHOW</text>
<text x="92" y="1221" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start">No mechanism here derives mₙ = Fₙ from the fork or from a physical lattice.</text>
<line x1="64" y1="1270" x2="1016" y2="1270" stroke="#263750" stroke-width="2"/>
<text x="64" y="1310" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">MODEL CONSEQUENCE ≠ PHYSICAL EVIDENCE</text>
<text x="1016" y="1310" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="end">EGREGORA  ·  TTI</text>
</svg>