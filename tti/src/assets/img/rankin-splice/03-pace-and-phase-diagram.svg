<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#070b15"/></linearGradient><radialGradient id="glow"><stop stop-color="#22395a" stop-opacity=".55"/><stop offset="1" stop-color="#080d1b" stop-opacity="0"/></radialGradient></defs>
<rect width="1080" height="1350" fill="url(#bg)"/>
<ellipse cx="825" cy="80" rx="380" ry="260" fill="url(#glow)"/>
<text x="64" y="74" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="3">RANKIN SKELETAL SPLICE</text>
<text x="1016" y="74" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="end">03 / 03</text>
<line x1="64" y1="100" x2="1016" y2="100" stroke="#263750" stroke-width="2"/>
<text x="64" y="158" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2.5">CONDITIONAL PACE LAW</text>
<text x="64" y="222" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="700" text-anchor="start">Acceleration does not</text>
<text x="64" y="288" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="700" text-anchor="start">settle the arrival question.</text>
<text x="64" y="364" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">The answer depends on the progress exponent and the chosen clock coupling.</text>
<rect x="64" y="330" width="952" height="196" rx="24" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="96" y="373" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.8">ASSUME</text>
<text x="96" y="423" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="650" text-anchor="start">Xₙ ~ C nᵝ</text>
<text x="455" y="423" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="650" text-anchor="start">Δtₙ = τ Xₙ⁻ᵅ</text>
<text x="96" y="477" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Then total time behaves like</text>
<text x="455" y="477" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="650" text-anchor="start">Σ n⁻ᵅᵝ</text>
<rect x="64" y="552" width="460" height="143" rx="20" fill="#142b35" stroke="#285b63" stroke-width="1"/>
<text x="96" y="591" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">αβ ≤ 1</text>
<text x="96" y="632" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.6">DIVERGENT TOTAL TIME</text>
<text x="96" y="662" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start">No finite-time arrival in this model.</text>
<rect x="556" y="552" width="460" height="143" rx="20" fill="#302232" stroke="#614058" stroke-width="1"/>
<text x="588" y="591" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start">αβ &gt; 1</text>
<text x="588" y="632" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.6">FINITE TOTAL TIME</text>
<text x="588" y="662" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start">Infinitely many stages in finite time.</text>
<text x="64" y="750" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.6">SAME CLOCK EXPONENT α = 1 · DIFFERENT PROGRESS</text>
<rect x="64" y="778" width="952" height="130" rx="20" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="96" y="820" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.3">FIBONACCI</text>
<text x="350" y="820" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start">Πₙ ~ c n  (β = 1)</text>
<text x="770" y="820" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">Σ 1/Πₙ diverges</text>
<text x="96" y="867" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.3">TRIANGULAR</text>
<text x="350" y="867" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start">Tₙ ~ n²/2  (β = 2)</text>
<text x="770" y="867" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">Σ 1/Tₙ converges</text>
<line x1="96" y1="842" x2="984" y2="842" stroke="#263750" stroke-width="1"/>
<text x="64" y="960" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.2">DEPTH SENSITIVITY · ΔΠₙ(λ) ~ c(φ/λ)ⁿ</text>
<rect x="64" y="986" width="296" height="145" rx="18" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="86" y="1028" fill="#77d9e8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">λ &gt; φ</text>
<text x="86" y="1068" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start">progress saturates</text>
<text x="86" y="1101" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">total time diverges</text>
<rect x="380" y="986" width="320" height="145" rx="18" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="402" y="1028" fill="#f4ca68" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">λ = φ</text>
<text x="402" y="1068" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start">progress ~ n</text>
<text x="402" y="1101" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">no arrival iff α ≤ 1</text>
<rect x="720" y="986" width="296" height="145" rx="18" fill="#101a2b" stroke="#263750" stroke-width="1"/>
<text x="742" y="1028" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">1 &lt; λ &lt; φ</text>
<text x="742" y="1068" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="550" text-anchor="start">progress exponential</text>
<text x="742" y="1101" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">finite time for α &gt; 0</text>
<rect x="64" y="1160" width="952" height="76" rx="16" fill="#251c31" stroke="none" stroke-width="1"/>
<text x="92" y="1192" fill="#f18bb9" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1.4">CONDITIONAL MATHEMATICS</text>
<text x="92" y="1221" fill="#f5f0e4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="450" text-anchor="start">Branching, depth, and the clock law are assumptions—not physical dynamics.</text>
<line x1="64" y1="1270" x2="1016" y2="1270" stroke="#263750" stroke-width="2"/>
<text x="64" y="1310" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.4">MODEL CONSEQUENCE ≠ PHYSICAL EVIDENCE</text>
<text x="1016" y="1310" fill="#a7b5ca" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="end">EGREGORA  ·  TTI</text>
</svg>