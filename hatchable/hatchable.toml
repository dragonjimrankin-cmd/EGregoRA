# Hatchable project manifest — EGregoRA
# Reference: https://hatchable.com/docs/developers/config
name        = "EGregoRA"
tagline     = "Life, Love, Magic — an order of enquiry co-founded by Edward Gregory and Jim Rankin"
description = "An ornate house of enquiry co-founded by Edward Gregory and Jim Rankin, braiding cosmic physics, natural philosophy, astrology, nature, druidry, trees, sacred geometry, magic, wizards, reality, the contact question, neuroscience, biology, psychology, astronomy, God, the Law of One and hallucinogenic meditation into one living study of reality. Seventeen pages: Introduction, Podcasts, Videos, Ask Ed a Question, Infographics, Druids, Sacred Geometry, Astrology, Artwork, Neurobiology, Consciousness, Extraterrestrials, Sound &amp; Music, Wizardry &amp; Rituals, Runes &amp; Charms, Elemental Alchemy, and Products."
category    = "Publishing"
tags        = ["esoteric", "science", "podcast", "philosophy", "astronomy", "druidry"]

# The Ask Ed oracle answers visitors with the owner's own model key (BYOK).
# The gateway resolves it server-side; project code never sees the raw key.
[ai]
required = false
providers = ["anthropic", "openai", "google"]

# Optional second open-source image route. The oracle draws with FLUX.1-schnell
# (open weights, keyless) by default; paste a Hugging Face token here to use
# Stable Diffusion XL instead of the keyless endpoint.
[[secret]]
key         = "HUGGINGFACE_API_KEY"
required    = false
description = "Optional Hugging Face token, for Stable Diffusion XL image generation."

# Optional: the strongest open-weights chat models (DeepSeek V3, Llama 3.3 70B,
# Qwen 3, Mistral) through OpenRouter. Without it the oracle still thinks, on a
# keyless open-weights route.
[[secret]]
key         = "OPENROUTER_API_KEY"
required    = false
description = "Optional OpenRouter token, for the strongest open-weights chat models."

# Video. HunyuanVideo 1.5 is open-weights but still needs a GPU somewhere:
# either of these keys turns the fox's camera on.
[[secret]]
key         = "FAL_KEY"
required    = false
description = "Optional fal.ai key, for HunyuanVideo 1.5 480p video generation."

[[secret]]
key         = "REPLICATE_API_TOKEN"
required    = false
description = "Optional Replicate token, as a second route to HunyuanVideo 1.5."

# The oracle's OpenAI route. A value pasted here on the Setup page overrides
# the key the owner supplied in lib/key-store.js.
[[secret]]
key         = "OPENAI_API_KEY"
required    = false
description = "OpenAI key used by the oracle for chat and as an image fallback."
