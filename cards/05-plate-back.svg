        <text x="45.5" y="15" font-family="Cinzel, Georgia, serif" font-size="2.4" fill="#f3ddaa"
     letter-spacing="1" text-anchor="middle">PODCASTS · FILMS · LIVE</text>
        <g font-family="EB Garamond, Georgia, serif" font-size="2.1" fill="#cdc2a8"
    text-anchor="middle" font-weight="normal">
    <text x="45.5" y="21.00">The long conversations, unhurried. The plates drawn and</text>
    <text x="45.5" y="23.90">explained on film. A live room that opens while the order</text>
    <text x="45.5" y="26.80">is working, and an archive kept for members who could not</text>
    <text x="45.5" y="29.70">be there. The oracle answers at any hour.</text>
  </g>
        
