        <text x="7" y="15" font-family="Cinzel, Georgia, serif" font-size="5" fill="#f3ddaa"
     letter-spacing="1.3" text-anchor="start">EGREGORA</text>
        <path d="M7 18 H84" stroke="#d7b05a" stroke-width="0.18" opacity="0.6"/>
        <g font-family="EB Garamond, Georgia, serif" font-size="2.1" fill="#d8cdb4"
    text-anchor="start" font-weight="normal">
    <text x="7" y="22.50">Eleven limbs, one subject: cosmic physics, druidry,</text>
    <text x="7" y="25.40">geometry, astrology, neuroscience, magic, alchemy,</text>
    <text x="7" y="28.30">consciousness.</text>
    <text x="7" y="31.20"></text>
    <text x="7" y="34.10">Each claim graded where it stands — science,</text>
    <text x="7" y="37.00">scholarship, speculation or myth — and nothing</text>
    <text x="7" y="39.90">oversold.</text>
  </g>
        <text x="7" y="53" font-family="Cinzel, Georgia, serif" font-size="2.1" fill="#d7b05a"
     letter-spacing="1" text-anchor="start">LIFE, LOVE, MAGIC.</text>
        
