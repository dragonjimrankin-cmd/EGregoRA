        <rect x="6.4" y="6.4" width="78.2" height="48.2"
     fill="none" stroke="#b99a46" stroke-width="0.3" />
        <text x="45.5" y="15" font-family="Cinzel, Georgia, serif" font-size="2.1" fill="#1a140c"
     letter-spacing="0.8" text-anchor="middle">PODCASTS · FILMS · THE LIVE ROOM</text>
        <path d="M15 18 H76" stroke="#b99a46" stroke-width="0.18"/>
        <g font-family="EB Garamond, Georgia, serif" font-size="2.05" fill="#2b231a"
    text-anchor="middle" font-weight="normal">
    <text x="45.5" y="22.50">Podcasts — the long conversations, in full and unhurried.</text>
    <text x="45.5" y="25.30"></text>
    <text x="45.5" y="28.10">Films — the plates and the workings, drawn and explained.</text>
    <text x="45.5" y="30.90"></text>
    <text x="45.5" y="33.70">The live room — open while the order is working, with the archive</text>
    <text x="45.5" y="36.50">kept afterwards for members who could not be there.</text>
    <text x="45.5" y="39.30"></text>
    <text x="45.5" y="42.10">Ask Ed, the oracle, answers in writing at any hour.</text>
  </g>
        
    
