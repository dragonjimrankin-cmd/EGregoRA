        <text x="7" y="27" font-family="Cinzel, Georgia, serif" font-size="3.6" fill="#f3ddaa"
     letter-spacing="1.3" text-anchor="start">BE IN THE ROOM</text>
        <g font-family="EB Garamond, Georgia, serif" font-size="2.1" fill="#c9bfa6"
    text-anchor="start" font-weight="normal">
    <text x="7" y="33.50">Podcasts, films, and a live room that opens while</text>
    <text x="7" y="36.40">the order is working — with the archive kept for</text>
    <text x="7" y="39.30">members who could not be there.</text>
  </g>
        
