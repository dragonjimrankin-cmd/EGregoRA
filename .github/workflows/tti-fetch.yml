name: Fetch the Two Infinities framework

# The sandbox has no egress to Google. This runner does: it pulls the public
# Drive folder, turns the PDFs into plain text, and commits the text (not the
# 20 MB of binaries) so the agent can read the framework.

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a10807-egregora"]
    paths:
      - "scripts/tti-fetch.mjs"
      - ".github/workflows/tti-fetch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch and extract
        continue-on-error: true
        run: |
          set +e
          mkdir -p ci-logs docs/tti
          {
            node scripts/tti-fetch.mjs 1yoTIvzp9oTIIkJ8gbr0e9gK4_G_EwO__ tti-src 2>&1
            echo "---- extract ----"
            for f in tti-src/*.pdf; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .pdf)
              pdftotext -layout "$f" "docs/tti/$b.txt" 2>&1 && \
                echo "text: docs/tti/$b.txt — $(wc -c < "docs/tti/$b.txt") bytes, $(wc -l < "docs/tti/$b.txt") lines"
            done
            echo "---- files ----"
            ls -la tti-src docs/tti
          } > ci-logs/tti-fetch.log 2>&1
          tail -60 ci-logs/tti-fetch.log

      - name: Publish the log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -w0 ci-logs/tti-fetch.log)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci-logs/tti-fetch.log?ref=${GITHUB_REF_NAME}" -q .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/tti-fetch.log" \
              -f message="ci: tti fetch log" -f content="$B64" -f branch="${GITHUB_REF_NAME}" -f sha="$SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/tti-fetch.log" \
              -f message="ci: tti fetch log" -f content="$B64" -f branch="${GITHUB_REF_NAME}"
          fi

      - name: Commit the text, if there is any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in docs/tti/*.txt; do
            [ -e "$f" ] || continue
            B64=$(base64 -w0 "$f")
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$f?ref=${GITHUB_REF_NAME}" -q .sha 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/$f" \
                -f message="ci: framework text" -f content="$B64" -f branch="${GITHUB_REF_NAME}" -f sha="$SHA"
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/$f" \
                -f message="ci: framework text" -f content="$B64" -f branch="${GITHUB_REF_NAME}"
            fi
            echo "pushed $f"
          done
