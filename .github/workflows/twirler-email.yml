name: Twirler contact address

# The Twirler site lives only inside its Hatchable project, and the agent's
# sandbox has no egress. This runner does, so the edit is made from here.
# Nothing in this workflow touches EGregoRA.

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a10807-egregora"]
    paths:
      - "scripts/twirler-email.mjs"
      - "scripts/twirler-run.mjs"
      - "ops/twirler-request.json"
      - ".github/workflows/twirler-email.yml"

permissions:
  contents: write

jobs:
  twirler:
    runs-on: ubuntu-latest
    env:
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN || 'hb_1jMSZIvpa2hRRNsQtmCQ72azX2AvWmWhtubjaaTZ' }}
      TWIRLER_PROJECT_ID: proj_uT6hbTUn8qxc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Run
        continue-on-error: true
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "# Twirler — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            node scripts/twirler-run.mjs ops/twirler-request.json 2>&1
            echo "exit=$?"
          } > ci-logs/twirler.log 2>&1
          sed -i -E 's/hb_[A-Za-z0-9]{8,}/hb_***REDACTED***/g' ci-logs/twirler.log
          tail -120 ci-logs/twirler.log

      - name: Publish the log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -w0 ci-logs/twirler.log)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci-logs/twirler.log?ref=${GITHUB_REF_NAME}" -q .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/twirler.log" \
              -f message="ci: twirler" -f content="$B64" -f branch="${GITHUB_REF_NAME}" -f sha="$SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/twirler.log" \
              -f message="ci: twirler" -f content="$B64" -f branch="${GITHUB_REF_NAME}"
          fi
