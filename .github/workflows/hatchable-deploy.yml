name: Deploy to Hatchable

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a10807-egregora"]
    paths:
      - "hatchable/**"
      - "scripts/hatchable-deploy.mjs"
      - ".github/workflows/hatchable-deploy.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Owner-supplied token, pasted at their explicit request. Rotate when done.
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN || 'hb_1jMSZIvpa2hRRNsQtmCQ72azX2AvWmWhtubjaaTZ' }}
      HATCHABLE_TOKEN_ALT: 'hb_eUgX8QFEYvbHEnMrpryYE8J5qHUPqI6LFPq5cH72'
      HATCHABLE_PROJECT_ID: proj_eiuxpFfTnwwx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Gink and ShakDrah must carry the same corpus
        run: python3 scripts/oracle-sync.py --check

      - name: Has anyone else deployed since we did?
        id: drift
        run: |
          mkdir -p ci-logs ops
          set +e
          node scripts/hatchable-drift.mjs --bundle hatchable \
            --project "${HATCHABLE_PROJECT_ID}" --key egregora > ci-logs/egregora-drift.log 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          sed -i -E 's/hb_[A-Za-z0-9]{8,}/hb_***REDACTED***/g' ci-logs/egregora-drift.log
          cat ci-logs/egregora-drift.log

      - name: Run deploy (never fails the job; output is captured)
        id: run
        if: steps.drift.outputs.code != '2'
        continue-on-error: true
        run: |
          set +e
          mkdir -p ci-logs
          {
            echo "# Hatchable deploy — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            if [ -z "$HATCHABLE_TOKEN" ]; then
              echo "NO TOKEN FOUND in secrets HATCHABLE_TOKEN / JIM / HATCHABLE / HATCHABLE_API_KEY / TOKEN"
            else
              echo "token present: ${#HATCHABLE_TOKEN} chars, prefix ${HATCHABLE_TOKEN:0:3}"
            fi
            echo
            echo "## curl reachability"
            curl -sS -o /dev/null -w "hatchable.com/mcp -> HTTP %{http_code}\n" --max-time 20 https://hatchable.com/mcp 2>&1
            echo
            echo
            echo "## deploy"
            RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/hatchable" \
              node scripts/hatchable-deploy.mjs --project "${HATCHABLE_PROJECT_ID}" 2>&1
            echo "exit=$?"
          } > ci-logs/hatchable-deploy.log 2>&1
          # Redact the token in case any tool echoes it back.
          if [ -n "$HATCHABLE_TOKEN" ]; then
            sed -i "s/${HATCHABLE_TOKEN}/***REDACTED***/g" ci-logs/hatchable-deploy.log
          fi
          sed -i -E 's/hb_[A-Za-z0-9]{8,}/hb_***REDACTED***/g' ci-logs/hatchable-deploy.log
          tail -60 ci-logs/hatchable-deploy.log

      - name: Record the version we just put live
        if: steps.drift.outputs.code != '2'
        run: |
          node scripts/hatchable-drift.mjs --bundle hatchable \
            --project "${HATCHABLE_PROJECT_ID}" --key egregora --record \
            >> ci-logs/egregora-drift.log 2>&1 || true

      - name: Publish the logs via the contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          put () {
            P="$1"; M="$2"
            [ -f "$P" ] || return 0
            B64=$(base64 -w0 "$P")
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${P}?ref=${GITHUB_REF_NAME}" -q .sha 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${P}" \
                -f message="$M" -f content="$B64" -f branch="${GITHUB_REF_NAME}" -f sha="$SHA"
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${P}" \
                -f message="$M" -f content="$B64" -f branch="${GITHUB_REF_NAME}"
            fi
          }
          put ci-logs/hatchable-deploy.log "ci: hatchable deploy log"
          put ci-logs/egregora-drift.log "ci: egregora drift check"
          put ops/egregora-deployed.json "ci: record the live egregora version"
          if [ -d ops/incoming/egregora ]; then
            find ops/incoming/egregora -type f | while read -r F; do
              put "$F" "ci: a foreign deploy's copy of ${F#ops/incoming/egregora/}"
            done
          fi
