name: Deploy to Hatchable

on:
  workflow_dispatch:
  push:
    branches: ["arena/01a10807-egregora"]
    paths:
      - "hatchable/**"
      - "scripts/hatchable-deploy.mjs"
      - ".github/workflows/hatchable-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Check token is present
        env:
          HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
        run: |
          if [ -z "$HATCHABLE_TOKEN" ]; then
            echo "::error::Repository secret HATCHABLE_TOKEN is not set."
            echo "Add it at Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Token present (${#HATCHABLE_TOKEN} chars)."

      - name: Show Hatchable tool surface
        env:
          HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
        run: node scripts/hatchable-deploy.mjs --tools
      - name: Create project and deploy
        env:
          HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
        run: node scripts/hatchable-deploy.mjs --name "EGregoRA" --slug egregora
