name: Deploy to Hatchable
on:
  workflow_dispatch:
  push:
    branches:
    - arena/01a10807-egregora
    paths:
    - hatchable/**
    - scripts/hatchable-deploy.mjs
    - .github/workflows/hatchable-deploy.yml
    - scripts/oracle-validate.mjs
    - ops/oracle-duplicate-baseline.json
    - ops/oracle-shadowed-baseline.json
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN || 'hb_1jMSZIvpa2hRRNsQtmCQ72azX2AvWmWhtubjaaTZ'
        }}
      HATCHABLE_TOKEN_ALT: hb_eUgX8QFEYvbHEnMrpryYE8J5qHUPqI6LFPq5cH72
      HATCHABLE_PROJECT_ID: proj_eiuxpFfTnwwx
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Gink and ShakDrah must carry the same corpus
      run: python3 scripts/oracle-sync.py --check
    - name: The corpus must be well formed and in step
      run: node scripts/oracle-validate.mjs
    - name: Has anyone else deployed since we did?
      id: drift
      run: "mkdir -p ci-logs ops\nset +e\nnode scripts/hatchable-drift.mjs --bundle\
        \ hatchable \\\n  --project \"${HATCHABLE_PROJECT_ID}\" --key egregora > ci-logs/egregora-drift.log\
        \ 2>&1\necho \"code=$?\" >> \"$GITHUB_OUTPUT\"\nsed -i -E 's/hb_[A-Za-z0-9]{8,}/hb_***REDACTED***/g'\
        \ ci-logs/egregora-drift.log\ncat ci-logs/egregora-drift.log\n"
    - name: Run deploy (never fails the job; output is captured)
      id: run
      if: steps.drift.outputs.code != '2'
      continue-on-error: true
      run: "set +e\nmkdir -p ci-logs\n{\n  echo \"# Hatchable deploy \u2014 $(date\
        \ -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  echo\n  if [ -z \"$HATCHABLE_TOKEN\" ]; then\n\
        \    echo \"NO TOKEN FOUND in secrets HATCHABLE_TOKEN / JIM / HATCHABLE /\
        \ HATCHABLE_API_KEY / TOKEN\"\n  else\n    echo \"token present: ${#HATCHABLE_TOKEN}\
        \ chars, prefix ${HATCHABLE_TOKEN:0:3}\"\n  fi\n  echo\n  echo \"## curl reachability\"\
        \n  curl -sS -o /dev/null -w \"hatchable.com/mcp -> HTTP %{http_code}\\n\"\
        \ --max-time 20 https://hatchable.com/mcp 2>&1\n  echo\n  echo\n  echo \"\
        ## deploy\"\n  RAW_BASE=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/hatchable\"\
        \ \\\n    node scripts/hatchable-deploy.mjs --project \"${HATCHABLE_PROJECT_ID}\"\
        \ 2>&1\n  echo \"exit=$?\"\n} > ci-logs/hatchable-deploy.log 2>&1\n# Redact\
        \ the token in case any tool echoes it back.\nif [ -n \"$HATCHABLE_TOKEN\"\
        \ ]; then\n  sed -i \"s/${HATCHABLE_TOKEN}/***REDACTED***/g\" ci-logs/hatchable-deploy.log\n\
        fi\nsed -i -E 's/hb_[A-Za-z0-9]{8,}/hb_***REDACTED***/g' ci-logs/hatchable-deploy.log\n\
        tail -60 ci-logs/hatchable-deploy.log\n"
    - name: Record the version we just put live
      if: steps.drift.outputs.code != '2'
      run: "node scripts/hatchable-drift.mjs --bundle hatchable \\\n  --project \"\
        ${HATCHABLE_PROJECT_ID}\" --key egregora --record \\\n  >> ci-logs/egregora-drift.log\
        \ 2>&1 || true\n"
    - name: Publish the logs via the contents API
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash scripts/ci-publish.sh ci-logs/hatchable-deploy.log "ci: hatchable deploy log"
        bash scripts/ci-publish.sh ci-logs/egregora-drift.log "ci: egregora drift check"
        bash scripts/ci-publish.sh ops/egregora-deployed.json "ci: record the live egregora version"
        if [ -d ops/incoming/egregora ]; then
          find ops/incoming/egregora -type f | while read -r F; do
            bash scripts/ci-publish.sh "$F" "ci: a foreign deploy's copy of ${F#ops/incoming/egregora/}"
          done
        fi
