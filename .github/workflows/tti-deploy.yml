name: Deploy The Shape of Becoming

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c016ca5c-egregora
    paths:
      - "tti/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/hatchable-deploy.mjs"
      - "scripts/sync-neural-voice-assets.mjs"
      - "scripts/test-neural-voice.mjs"
      - "scripts/test-oracle-knowledge.mjs"
      - "ops/tti-project.txt"
      - ".github/workflows/tti-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build and validate the static site
        run: |
          npm ci
          node --check tti/src/assets/js/oracle-knowledge.js
          node --check tti/src/assets/js/neural-voice.js
          node --check tti/src/assets/js/dragon.js
          node --check tti/src/assets/js/fox.js
          node --check tti/src/assets/js/site.js
          node scripts/test-oracle-knowledge.mjs
          node scripts/test-neural-voice.mjs
          npm run build:tti:hatchable
          test -s tti/hatchable/public/index.html
          test -s tti/hatchable/public/time-and-residue/index.html
          test -s tti/hatchable/public/inverted-toruses/index.html
          test -s tti/hatchable/public/little-red-dots/index.html
          test -s tti/hatchable/public/ask-shakdrah/index.html
          test -s tti/hatchable/public/assets/js/oracle-knowledge.js
          test -s tti/hatchable/public/assets/js/neural-voice.js
          test -s tti/hatchable/public/assets/js/headtts/worker-tts.mjs
          test -s tti/hatchable/public/assets/js/headtts/dictionaries/en-us.txt
          test "$(wc -c < tti/hatchable/public/assets/js/headtts/voices/bm_george.bin)" -gt 500000
          test "$(wc -c < tti/hatchable/public/assets/js/headtts/voices/am_fenrir.bin)" -gt 500000
          test -s tti/hatchable/public/assets/js/headtts/LICENSE-Kokoro.txt
          grep -Fq 'The Shape of Becoming: Infinity, Gravity and Existence' tti/hatchable/public/index.html
          grep -Fq 'A Geometry of the Cosmos' tti/hatchable/public/index.html
          grep -q 'The One Residue That Travels' tti/hatchable/public/time-and-residue/index.html
          grep -q 'One Source Per Universe, Every Being Eligible' tti/hatchable/public/time-and-residue/index.html
          grep -q 'The Channeling Circle as a Claimed Reception Archive' tti/hatchable/public/time-and-residue/index.html
          grep -q 'Open the complete 39-session date and attribution index' tti/hatchable/public/time-and-residue/index.html
          grep -q 'Sixteen prepared answers' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'What is in The Channeling Circle transcript archive?' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'ASK SHAKDRAH TO DRAW' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'ASK SHAKDRAH TO FILM' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'Natural voice: off' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'Male neural voice' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'Choose a voice to turn Natural voice on and hear an immediate audition' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'six site-hosted male voice embeddings' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'Answer text stays on this device' tti/hatchable/public/ask-shakdrah/index.html
          grep -q 'bm_george' tti/hatchable/public/assets/js/neural-voice.js
          grep -q 'voiceURL: new URL("voices/?v=male-voices-3", root).href' tti/hatchable/public/assets/js/neural-voice.js
          grep -q 'avatar-voice-picker' tti/hatchable/public/assets/css/main.css
          grep -q 'prepareOutput' tti/hatchable/public/assets/js/neural-voice.js
          grep -q 'voices: MALE_NEURAL_VOICES.map' tti/hatchable/public/assets/js/neural-voice.js
          grep -q 'message.data.voice !== selectedVoice' tti/hatchable/public/assets/js/neural-voice.js
          grep -q 'worker-tts.mjs?v=male-voices-3' tti/hatchable/public/assets/js/neural-voice.js
          grep -q 'await loadVoice(x)' tti/hatchable/public/assets/js/headtts/worker-tts.mjs
          grep -q 'metadata.voice = d.voice' tti/hatchable/public/assets/js/headtts/worker-tts.mjs
          grep -q 'naturalWanted = true' tti/hatchable/public/assets/js/dragon.js
          grep -q 'voice audition' tti/hatchable/public/assets/js/dragon.js
          grep -q 'const throatScutes' tti/hatchable/public/assets/js/dragon.js
          grep -q 'roundNow' tti/hatchable/public/assets/js/dragon.js
          grep -q 'Kokoro-82M-v1.0-ONNX-timestamped' tti/hatchable/public/assets/js/headtts/headtts.mjs
          grep -Fq 'item.message.data.voice = (item.message.data.voice || this.ttsSetup.voice).slice()' tti/hatchable/public/assets/js/headtts/headtts.mjs
          grep -q 'const avatarName' tti/hatchable/public/assets/js/site.js
          grep -q 'circle-evidence' tti/hatchable/public/assets/js/oracle-knowledge.js
          grep -q 'baryogenesis-boundary' tti/hatchable/public/assets/js/oracle-knowledge.js
          grep -q 'The Universe of Inverted Tori' tti/hatchable/public/inverted-toruses/index.html
          grep -q 'One Seam, Seen as Many Tori' tti/hatchable/public/inverted-toruses/index.html
          grep -q 'The Universe Is the Möbius Seam' tti/hatchable/public/inverted-toruses/index.html
          grep -q 'Handedness Reversal Is Not Time Reversal' tti/hatchable/public/inverted-toruses/index.html
          grep -q 'Earned, Chosen, Refused' tti/hatchable/public/inverted-toruses/index.html
          grep -q 'JWST&rsquo;s Little Red Dots, Through TTI' tti/hatchable/public/little-red-dots/index.html
          grep -q 'An Integration Front Carrying an Older Residue' tti/hatchable/public/little-red-dots/index.html
          grep -q 'What Could Exist Between Minus One and Zero?' tti/hatchable/public/little-red-dots/index.html
          grep -q 'Not a Fourth Pole, but a Boundary Condition' tti/hatchable/public/little-red-dots/index.html
          grep -q 'The conservation fork' tti/hatchable/public/little-red-dots/index.html
          grep -q 'Six Debts the Sky Can Collect' tti/hatchable/public/little-red-dots/index.html
          grep -q 'The Zero-Seam Test' tti/hatchable/public/little-red-dots/index.html
          grep -q 'A Two-Phase, Twenty-Four-Month Study' tti/hatchable/public/little-red-dots/research-proposal/index.html
          grep -q 'Three Models Must Enter, and Any May Lose' tti/hatchable/public/little-red-dots/research-proposal/index.html
          grep -q 'Choose What Crosses Before Counting What Shines' tti/hatchable/public/little-red-dots/research-proposal/index.html
          grep -q 'Enter the TTI conjecture' tti/hatchable/public/essays/index.html
          grep -q 'Read the Zero-Seam research proposal' tti/hatchable/public/essays/index.html
          grep -q 'little red dots are compact' tti/hatchable/public/cosmic-ledger/index.html
          npx html-validate --rule 'no-trailing-whitespace:off' \
            tti/hatchable/public/time-and-residue/index.html \
            tti/hatchable/public/inverted-toruses/index.html \
            tti/hatchable/public/little-red-dots/index.html \
            tti/hatchable/public/little-red-dots/research-proposal/index.html \
            tti/hatchable/public/ask-shakdrah/index.html \
            tti/hatchable/public/torus/index.html \
            tti/hatchable/public/moebius/index.html \
            tti/hatchable/public/essays/index.html \
            tti/hatchable/public/out-of-phase/index.html

      - name: Deploy the existing Hatchable project
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tti/hatchable
          RAW_SOURCE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/tti/src
        run: |
          if [ -z "$HATCHABLE_TOKEN" ]; then
            echo "::error title=Hatchable deployment unavailable::HATCHABLE_TOKEN is not configured as a repository secret. The site built successfully, but the live project was not changed."
            exit 1
          fi

          PROJECT_ID=$(tr -d ' \n\r' < ops/tti-project.txt)
          STATUS=1
          for ATTEMPT in 1 2 3 4 5 6; do
            set +e
            node scripts/hatchable-deploy.mjs \
              --bundle tti/hatchable \
              --project "$PROJECT_ID" \
              --name "The Shape of Becoming: Infinity, Gravity and Existence" \
              --slug two-infinities 2>&1 | tee /tmp/hatchable-deploy.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then break; fi
            if [ "$ATTEMPT" -lt 6 ] && grep -Eqi 'HTTP 429|Too Many Attempts' /tmp/hatchable-deploy.log; then
              WAIT=$((ATTEMPT * 30))
              echo "Hatchable is rate-limiting deployment; retrying in ${WAIT}s."
              sleep "$WAIT"
            else
              break
            fi
          done

          if [ "$STATUS" -ne 0 ]; then
            MESSAGE=$(tail -20 /tmp/hatchable-deploy.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-1800)
            echo "::error title=Hatchable deployment failed::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Verify the live essays and ShakDrah knowledge
        run: |
          node <<'NODE'
          const pages = [
            {
              url: 'https://the-two-infinities.hatchable.site/',
              markers: ['The Shape of Becoming:', 'Infinity, Gravity and Existence', 'A Geometry of the Cosmos']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/cosmic-ledger/',
              markers: ['The Cosmic Ledger', 'JWST&rsquo;s little red dots are compact',
                'carrying an inherited', 'not a result of the equations above']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/time-and-residue/',
              markers: ['The One Residue That Travels', 'One Source Per Universe, Every Being Eligible',
                'The Prime Being Changes With the Instance', 'Distribution Is Interpretation',
                'The Channeling Circle as a Claimed Reception Archive',
                'Open the complete 39-session date and attribution index']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/inverted-toruses/',
              markers: ['The Universe of Inverted Tori', 'One Seam, Seen as Many Tori',
                'The Universe Is the Möbius Seam', 'Handedness Reversal Is Not Time Reversal',
                'Earned, Chosen, Refused']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/little-red-dots/',
              markers: ['JWST&rsquo;s Little Red Dots, Through TTI',
                'An Integration Front Carrying an Older Residue',
                'What Could Exist Between Minus One and Zero?',
                'Not a Fourth Pole, but a Boundary Condition', 'The conservation fork',
                'Six Debts the Sky Can Collect',
                'The Dot May Be a Memory Learning to Shine Again']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/little-red-dots/research-proposal/',
              markers: ['The Zero-Seam Test', 'A Two-Phase, Twenty-Four-Month Study',
                'Three Models Must Enter, and Any May Lose',
                'Five Signatures, One Declared Primary Test',
                'Choose What Crosses Before Counting What Shines',
                'Twenty-Four Months with Permission to Stop Early']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/essays/',
              markers: ['JWST&rsquo;s Little Red Dots', 'Enter the TTI conjecture',
                'Read the Zero-Seam research proposal']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/ask-shakdrah/',
              markers: ['Sixteen prepared answers', 'What is in The Channeling Circle transcript archive?',
                'Can reversible mixing create a matter-antimatter imbalance?',
                'ASK SHAKDRAH TO DRAW', 'ASK SHAKDRAH TO FILM', 'oracle-knowledge.js',
                'Natural voice: off', 'Male neural voice',
                'Choose a voice to turn Natural voice on and hear an immediate audition',
                'six site-hosted male voice embeddings', 'Answer text stays on this device']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/assets/js/oracle-knowledge.js',
              markers: ['circle-evidence', 'prime-per-instance', 'mapping-space',
                'baryogenesis-boundary', 'epistemic-grading']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/assets/js/neural-voice.js',
              markers: ['NaturalVoiceEngine', 'MALE_NEURAL_VOICES', 'am_fenrir', 'bm_lewis',
                'voiceURL: new URL("voices/?v=male-voices-3", root).href', 'voices: MALE_NEURAL_VOICES.map',
                'message.data.voice !== selectedVoice', 'worker-tts.mjs?v=male-voices-3',
                'prepareOutput', 'audioTone', 'headtts/headtts.mjs',
                'generated privately on this device']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/assets/js/headtts/headtts.mjs',
              markers: ['item.message.data.voice = (item.message.data.voice || this.ttsSetup.voice).slice()']
            },
            ...['bm_george', 'bm_fable', 'bm_lewis', 'am_fenrir', 'am_michael', 'am_puck'].map((voiceId) => ({
              url: `https://the-two-infinities.hatchable.site/assets/js/headtts/voices/${voiceId}.bin`,
              markers: [], minBytes: 500000, voiceId
            })),
            {
              url: 'https://the-two-infinities.hatchable.site/assets/js/dragon.js',
              markers: ['tti-shakdrah-neural-male-voice', 'naturalVoice.setVoice',
                'naturalWanted = true', 'voice audition', 'const throatScutes',
                'microGaze', 'roundNow', 'wings.forEach', 'const nostrils']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/assets/js/headtts/worker-tts.mjs',
              markers: ['StyleTextToSpeech2Model', 'updateTimestamps', 'audioEncoding',
                'await loadVoice(x)', 'metadata.voice = d.voice']
            },
            {
              url: 'https://the-two-infinities.hatchable.site/assets/js/site.js',
              markers: ['const avatarName', 'tti-shakdrah-muted', "'s voice is on", 'window.EGDragon || window.EGFox']
            }
          ];
          let detail = 'the pages did not become current';
          for (let attempt = 1; attempt <= 10; attempt++) {
            try {
              const checked = await Promise.all(pages.map(async (page) => {
                const response = await fetch(`${page.url}?deploy=${process.env.GITHUB_SHA || Date.now()}`, {
                  headers: { 'cache-control': 'no-cache' }
                });
                const body = await response.arrayBuffer();
                const html = page.markers.length ? new TextDecoder().decode(body) : '';
                const missingMarkers = page.markers.filter((marker) => !html.includes(marker));
                const current = response.ok && body.byteLength >= (page.minBytes || 1) &&
                  missingMarkers.length === 0;
                const voiceHash = page.voiceId
                  ? Buffer.from(await crypto.subtle.digest('SHA-256', body)).toString('hex')
                  : null;
                return { page, response, current, voiceHash, missingMarkers };
              }));
              const voiceChecks = checked.filter((result) => result.page.voiceId);
              const voicesDistinct = voiceChecks.length === 6 &&
                new Set(voiceChecks.map((result) => result.voiceHash)).size === 6;
              if (checked.every((result) => result.current) && voicesDistinct) {
                console.log('Live essays, ShakDrah chooser and six distinct embeddings verified.');
                process.exit(0);
              }
              detail = checked.map((result) =>
                `${result.page.url} HTTP ${result.response.status}; current=${result.current}; ` +
                `missing=${result.missingMarkers.join(',') || 'none'}`).join(' | ') +
                ` | sixDistinctVoices=${voicesDistinct}`;
            } catch (error) {
              detail = error && error.message || String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 8000));
          }
          const safe = String(detail).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1200);
          console.log(`::error title=Live TTI essay verification failed::${safe}`);
          process.exit(1);
          NODE
