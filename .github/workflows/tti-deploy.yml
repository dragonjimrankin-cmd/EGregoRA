      - name: Recheck and commit TTI Admin Edit changes before deployment
        run: |
          scripts/commit-admin-edit-snapshot.sh \
            tti \
            https://the-two-infinities.hatchable.site/api/admin-commit \
            tti/src/static/admin-edits.snapshot.json \
            "$GITHUB_REF_NAME" \
            check
          cp tti/src/static/admin-edits.snapshot.json tti/hatchable/public/admin-edits.snapshot.json
          cmp tti/src/static/admin-edits.snapshot.json tti/hatchable/public/admin-edits.snapshot.json

      - name: Deploy the existing Hatchable project
        run: |
          if [ -z "$HATCHABLE_TOKEN" ]; then
            echo "::error title=Hatchable deployment unavailable::HATCHABLE_TOKEN is not configured as a repository secret. The site built successfully, but the live project was not changed."
            exit 1
          fi

          export RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ADMIN_COMMIT_SHA}/tti/hatchable"
          export RAW_SOURCE_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ADMIN_COMMIT_SHA}/tti/src"
          PROJECT_ID=$(tr -d ' \n\r' < ops/tti-project.txt)
          STATUS=1
          for ATTEMPT in 1 2 3 4 5 6; do
            set +e
            node scripts/hatchable-deploy.mjs \
              --bundle tti/hatchable \
              --project "$PROJECT_ID" \
              --name "The Two Infinities: Eternal Integration of the Self" \
              --slug two-infinities \
              --description "$TTI_PROJECT_DESCRIPTION" \
              --intent "$TTI_DEPLOY_INTENT" \
              --summary "$TTI_DEPLOY_SUMMARY" 2>&1 | tee /tmp/hatchable-deploy.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then break; fi
            if [ "$ATTEMPT" -lt 6 ] && grep -Eqi 'HTTP 429|Too Many Attempts' /tmp/hatchable-deploy.log; then
              WAIT=$((ATTEMPT * 30))
              echo "Hatchable is rate-limiting deployment; retrying in ${WAIT}s."
              sleep "$WAIT"
            else
              break
            fi
          done

          if [ "$STATUS" -ne 0 ]; then
            MESSAGE=$(tail -20 /tmp/hatchable-deploy.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-1800)
            echo "::error title=Hatchable deployment failed::$MESSAGE"
            exit "$STATUS"
          fi
          grep -Fq 'project metadata synchronised: The Two Infinities: Eternal Integration of the Self' /tmp/hatchable-deploy.log

