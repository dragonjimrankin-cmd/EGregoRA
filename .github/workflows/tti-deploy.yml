name: Deploy The Two Infinities

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c016ca5c-egregora
    paths:
      - "tti/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/hatchable-deploy.mjs"
      - "scripts/commit-admin-edit-snapshot.sh"
      - "scripts/sync-admin-edit-snapshot.mjs"
      - "scripts/test-admin-edit-commit.mjs"
      - "scripts/sync-neural-voice-assets.mjs"
      - "scripts/test-neural-voice.mjs"
      - "scripts/test-oracle-knowledge.mjs"
      - "scripts/test-tti-header.mjs"
      - "scripts/test-tti-atlas.mjs"
      - "scripts/test-tti-plates.mjs"
      - "scripts/test-tti-research-layout.mjs"
      - "scripts/test-tti-editorial-guides.mjs"
      - "scripts/build-tti-longform-sources.mjs"
      - "scripts/test-tti-longform-syntheses.mjs"
      - "scripts/test-tti-riemann-programme.mjs"
      - "scripts/test-tti-pi-from-zero-and-one.mjs"
      - "scripts/test-tti-relocations.mjs"
      - "scripts/tti-gather-plates.mjs"
      - "scripts/audit-tti.mjs"
      - "ops/tti-project.txt"
      - ".github/workflows/tti-deploy.yml"

permissions:
  contents: write

# Both live projects share one branch. Serialising their deployment jobs keeps
# automatic Admin Edit commits from racing one another.
concurrency:
  group: serialized-live-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
      TTI_PROJECT_DESCRIPTION: "The Two Infinities: Eternal Integration of the Self is an independent speculative cosmology research project founded by Jim Rankin, UK, in 2026. It investigates infinity, geometry, integration, consciousness, gravity, time, topology, cosmic return, mathematical proof auditing and testable failure conditions across thirty-one studies and four project resources."
      TTI_DEPLOY_INTENT: "Deploy The Two Infinities research project"
      TTI_DEPLOY_SUMMARY: "Publishes The Two Infinities: Eternal Integration of the Self, the independent speculative cosmology research project founded by Jim Rankin, including its studies, research resources, Atlas, plates, and ShakDrah research assistant."
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Commit queued TTI Admin Edit changes
        run: |
          scripts/commit-admin-edit-snapshot.sh \
            tti \
            https://the-two-infinities.hatchable.site/api/admin-commit \
            tti/src/static/admin-edits.snapshot.json \
            "$GITHUB_REF_NAME" \
            refresh

      - name: Install dependencies
        run: npm ci

      - name: Check Admin Edit endpoint syntax
        run: node --check tti/hatchable/api/admin-commit.js

      - name: Check Admin Edit client syntax
        run: node --check tti/src/assets/js/admin-edit.js

      - name: Check Admin Edit snapshot sync syntax
        run: node --check scripts/sync-admin-edit-snapshot.mjs

      - name: Test Admin Edit snapshot commit flow
        run: node scripts/test-admin-edit-commit.mjs

      - name: Check Oracle knowledge syntax
        run: node --check tti/src/assets/js/oracle-knowledge.js

      - name: Check neural voice syntax
        run: node --check tti/src/assets/js/neural-voice.js

      - name: Check Dragon assistant syntax
        run: node --check tti/src/assets/js/dragon.js

      - name: Check Fox assistant syntax
        run: node --check tti/src/assets/js/fox.js

      - name: Check Atlas syntax
        run: node --check tti/src/assets/js/atlas.js

      - name: Check site JavaScript syntax
        run: node --check tti/src/assets/js/site.js

      - name: Test TTI Oracle knowledge
        run: node scripts/test-oracle-knowledge.mjs --tti-only

      - name: Test TTI relocations
        run: node scripts/test-tti-relocations.mjs

      - name: Test neural voice
        run: node scripts/test-neural-voice.mjs

      - name: Build and validate the TTI source
        run: |
          npm run build:tti:hatchable
          npm run lint:tti
          node scripts/test-tti-header.mjs --built
          node scripts/test-tti-atlas.mjs
          node scripts/test-tti-research-layout.mjs
          node scripts/test-tti-editorial-guides.mjs
          node scripts/test-tti-longform-syntheses.mjs
          node scripts/test-tti-riemann-programme.mjs
          node scripts/test-tti-pi-from-zero-and-one.mjs
          node scripts/test-tti-plates.mjs
          node scripts/audit-tti.mjs

      - name: Verify the generated TTI bundle
        run: |
          test -s tti/hatchable/public/index.html
          test -s tti/hatchable/public/archive/index.html
          test -s tti/hatchable/public/admin-edits.snapshot.json
          grep -Fq 'admin-edit-commit-snapshot' tti/hatchable/public/admin-edits.snapshot.json
          grep -Fq 'automatic Git commit before the next deployment' tti/hatchable/public/assets/js/admin-edit.js
          test -s tti/hatchable/api/admin-commit.js
          grep -Fq 'admin-edit-commit-snapshot' tti/hatchable/api/admin-commit.js
          test -s tti/hatchable/public/pi-from-zero-and-one/index.html
          test -s tti/hatchable/public/time-and-residue/index.html
          test -s tti/hatchable/public/inverted-toruses/index.html
          test -s tti/hatchable/public/wormholes/index.html
          test -s tti/hatchable/public/temporal-antipodes/index.html
          test -s tti/hatchable/public/entropy/index.html
          test -s tti/hatchable/public/double-inversion/index.html
          test -s tti/hatchable/public/accumulated-differentials/index.html
          test -s tti/hatchable/public/little-red-dots/index.html
          test -s tti/hatchable/public/little-red-dots/research-proposal/index.html
          test -s tti/hatchable/public/riemann-programme/index.html
          test -s tti/hatchable/public/riemann-proof-audit/index.html
          test -s tti/hatchable/public/riemann-splice-questions/index.html
          test -s tti/hatchable/public/stress-tests/index.html
          test -s tti/hatchable/public/plates/index.html
          test -s tti/hatchable/public/sitemap.xml
          test -s tti/hatchable/public/feed.xml
          test -s tti/hatchable/public/ask-shakdrah/index.html
          test -s tti/hatchable/public/assets/css/r35-baseline.css
          test -s tti/hatchable/public/assets/css/r35-integration.css
          test -s tti/hatchable/public/assets/js/oracle-knowledge.js
          test -s tti/hatchable/public/assets/js/atlas.js
          test -s tti/hatchable/public/assets/js/vendor/three.module.js
          test -s tti/hatchable/public/assets/js/neural-voice.js
