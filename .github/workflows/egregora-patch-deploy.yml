name: Deploy EGregoRA patch

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c016ca5c-egregora
    paths:
      - "egregora-patch/**"
      - "ops/egregora-project.txt"
      - "scripts/hatchable-deploy.mjs"
      - "scripts/test-voiceprint.mjs"
      - "scripts/test-neural-voice.mjs"
      - "scripts/test-oracle-knowledge.mjs"
      - "scripts/test-media-upload.mjs"
      - "scripts/test-private-whisper.mjs"
      - "scripts/test-progress-liveness.mjs"
      - "scripts/test-egregora-infographics.mjs"
      - "scripts/test-avatar-summary.mjs"
      - "scripts/test-speaker-map.mjs"
      - "scripts/test-mobius-spelling.mjs"
      - "scripts/test-tti-relocations.mjs"
      - "scripts/sync-private-whisper-assets.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/egregora-patch-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate the patch
        run: |
          npm ci --ignore-scripts
          node scripts/sync-private-whisper-assets.mjs
          git diff --exit-code -- egregora-patch/public/assets/js/private-whisper
          node --check egregora-patch/api/transcribe.js
          node --check egregora-patch/api/media.js
          node --check egregora-patch/lib/upload-parts.js
          node --check egregora-patch/api/edit.js
          node --check egregora-patch/pages/feed.js
          node --check egregora-patch/public/assets/js/media-admin.js
          node --check egregora-patch/public/assets/js/progress-live.js
          node --check egregora-patch/public/assets/js/private-whisper/browser-whisper.js
          node --check egregora-patch/public/assets/js/voiceprint.js
          node --check egregora-patch/public/assets/js/admin-edit.js
          node --check egregora-patch/public/assets/js/oracle-knowledge.js
          node --check egregora-patch/public/assets/js/neural-voice.js
          node --check egregora-patch/public/assets/js/fox.js
          node --check egregora-patch/public/assets/js/infographics-accordion.js
          node scripts/test-voiceprint.mjs
          node scripts/test-oracle-knowledge.mjs
          node scripts/test-neural-voice.mjs
          node scripts/test-media-upload.mjs
          node scripts/test-private-whisper.mjs
          node scripts/test-progress-liveness.mjs
          node scripts/test-egregora-infographics.mjs
          node scripts/test-avatar-summary.mjs
          node scripts/test-speaker-map.mjs
          node scripts/test-mobius-spelling.mjs
          node scripts/test-tti-relocations.mjs
          test -s egregora-patch/public/assets/js/private-whisper/LICENSE-BrowserWhisper.txt
          test -s egregora-patch/public/assets/js/private-whisper/LICENSE-MediaBunny.txt
          test -s egregora-patch/public/assets/js/headtts/worker-tts.mjs
          test -s egregora-patch/public/assets/js/headtts/dictionaries/en-us.txt
          test "$(wc -c < egregora-patch/public/assets/js/headtts/voices/bm_fable.bin)" -gt 500000
          test "$(wc -c < egregora-patch/public/assets/js/headtts/voices/am_puck.bin)" -gt 500000
          test -s egregora-patch/public/assets/js/headtts/LICENSE-Kokoro.txt
          test -s egregora-patch/public/assets/css/avatar-voice.css
          grep -q 'avatar-voice-picker' egregora-patch/public/assets/css/avatar-voice.css
          grep -q 'One hundred and eleven illustrated plates' egregora-patch/public/infographics/index.html
          test "$(grep -c 'name=\"infographic-room\"' egregora-patch/public/infographics/index.html)" -eq 13
          grep -q 'id="info-infographics"' egregora-patch/public/infographics/index.html
          grep -q '40 drawings' egregora-patch/public/infographics/index.html
          grep -q '.info-fold\[open\]' egregora-patch/public/assets/css/infographics-accordion.css
          grep -q 'closeFolds' egregora-patch/public/assets/js/infographics-accordion.js
          grep -q 'Twenty-three prepared answers' egregora-patch/public/ask-ed/index.html
          grep -q 'What is in The Channeling Circle transcript archive?' egregora-patch/public/ask-ed/index.html
          grep -q 'Why can the smaller and bigger infinities never fully synchronise?' egregora-patch/public/ask-ed/index.html
          grep -q 'Could little red dots be remnants of a previous universe?' egregora-patch/public/ask-ed/index.html
          grep -q 'What is the Zero-Seam Test?' egregora-patch/public/ask-ed/index.html
          grep -q 'Is TTI integration the same thing as entropy?' egregora-patch/public/ask-ed/index.html
          grep -q 'Can an inverted torus be a traversable wormhole?' egregora-patch/public/ask-ed/index.html
          grep -q 'Does residue from one inversion survive a second inversion?' egregora-patch/public/ask-ed/index.html
          grep -q 'How do accumulated differentials connect to mass and gravity?' egregora-patch/public/ask-ed/index.html
          grep -q 'Natural voice: off' egregora-patch/public/ask-ed/index.html
          grep -q 'Male neural voice' egregora-patch/public/ask-ed/index.html
          grep -q 'Choose a voice to turn Natural voice on and hear an immediate audition' egregora-patch/public/ask-ed/index.html
          grep -q 'six site-hosted male voice embeddings' egregora-patch/public/ask-ed/index.html
          grep -q 'Answer text stays on this device' egregora-patch/public/ask-ed/index.html
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('egregora-patch/public/ask-ed/index.html', 'utf8');
          const prompt = html.indexOf('class="fox-ask"');
          const output = html.indexOf('class="oracle-chat"');
          if (prompt < 0 || output < 0 || prompt >= output) {
            throw new Error('Gink prompt must appear before the conversation output.');
          }
          NODE
          grep -q 'bm_fable' egregora-patch/public/assets/js/neural-voice.js
          grep -q 'voiceURL: new URL("voices/?v=male-voices-3", root).href' egregora-patch/public/assets/js/neural-voice.js
          grep -q 'prepareOutput' egregora-patch/public/assets/js/neural-voice.js
          grep -q 'voices: MALE_NEURAL_VOICES.map' egregora-patch/public/assets/js/neural-voice.js
          grep -q 'message.data.voice !== selectedVoice' egregora-patch/public/assets/js/neural-voice.js
          grep -q 'worker-tts.mjs?v=male-voices-3' egregora-patch/public/assets/js/neural-voice.js
          grep -q 'await loadVoice(x)' egregora-patch/public/assets/js/headtts/worker-tts.mjs
          grep -q 'metadata.voice = d.voice' egregora-patch/public/assets/js/headtts/worker-tts.mjs
          grep -q 'naturalWanted = true' egregora-patch/public/assets/js/fox.js
          grep -q 'voice audition' egregora-patch/public/assets/js/fox.js
          grep -q 'microGaze' egregora-patch/public/assets/js/fox.js
          grep -q 'roundNow' egregora-patch/public/assets/js/fox.js
          grep -Fq 'item.message.data.voice = (item.message.data.voice || this.ttsSetup.voice).slice()' egregora-patch/public/assets/js/headtts/headtts.mjs
          node -e "const fs=require('fs'); const id=fs.readFileSync('ops/egregora-project.txt','utf8').trim(); if (!/^proj_[A-Za-z0-9]+$/.test(id)) process.exit(1)"

      - name: Deploy to the existing EGregoRA project
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/egregora-patch
        run: |
          if [ -z "$HATCHABLE_TOKEN" ]; then
            echo "::error title=Hatchable deployment unavailable::HATCHABLE_TOKEN is not configured as a repository secret."
            exit 1
          fi

          PROJECT_ID=$(tr -d ' \n\r' < ops/egregora-project.txt)
          STATUS=1
          for ATTEMPT in 1 2 3 4 5 6; do
            set +e
            node scripts/hatchable-deploy.mjs \
              --bundle egregora-patch \
              --project "$PROJECT_ID" \
              --name "EGregoRA" \
              --slug egregora 2>&1 | tee /tmp/egregora-patch-deploy.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then break; fi
            if [ "$ATTEMPT" -lt 6 ] && grep -Eqi 'HTTP 429|Too Many Attempts' /tmp/egregora-patch-deploy.log; then
              WAIT=$((ATTEMPT * 30))
              echo "Hatchable is rate-limiting deployment; retrying in ${WAIT}s."
              sleep "$WAIT"
            else
              break
            fi
          done

          if [ "$STATUS" -ne 0 ]; then
            MESSAGE=$(tail -20 /tmp/egregora-patch-deploy.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-1800)
            echo "::error title=EGregoRA patch deployment failed::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Verify live infographics and Gink prepared knowledge
        run: |
          node <<'NODE'
          const targets = [
            {
              url: 'https://egregora.hatchable.site/ask-ed/',
              markers: ['Twenty-three prepared answers', 'Can an inverted torus be a traversable wormhole?',
                'What is in The Channeling Circle transcript archive?',
                'Why can the smaller and bigger infinities never fully synchronise?',
                'Could little red dots be remnants of a previous universe?', 'What is the Zero-Seam Test?',
                'Is TTI integration the same thing as entropy?',
                'Does residue from one inversion survive a second inversion?',
                'How do accumulated differentials connect to mass and gravity?',
                'Can reversible mixing create a matter-antimatter imbalance?', 'oracle-knowledge.js',
                'Natural voice: off', 'Male neural voice',
                'Choose a voice to turn Natural voice on and hear an immediate audition',
                'six site-hosted male voice embeddings', 'Answer text stays on this device',
                'avatar-voice.css?v=prompt-first-1',
                'fox.js?v=male-voices-3'],
              orderedMarkers: ['class="fox-ask"', 'class="oracle-chat"']
            },
            {
              url: 'https://egregora.hatchable.site/infographics/',
              markers: ['One hundred and eleven illustrated plates', '111 drawings in thirteen sections',
                'name="infographic-room"', 'id="info-astrology"', 'id="info-infographics"',
                '40 drawings', 'infographics-accordion.css?v=exclusive-folds-1',
                'infographics-accordion.js?v=exclusive-folds-1']
            },
            {
              url: 'https://egregora.hatchable.site/assets/css/infographics-accordion.css',
              markers: ['.info-fold[open]', '.info-fold-toggle::after',
                '@media (max-width: 620px)', 'prefers-reduced-motion: reduce']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/infographics-accordion.js',
              markers: ['const closeFolds', 'if (fold.open) closeFolds(fold)',
                'const openFromHash', 'openFold.removeAttribute("open")']
            },
            {
              url: 'https://egregora.hatchable.site/assets/css/avatar-voice.css',
              markers: ['.avatar-voice-picker', 'select:focus-visible',
                '.fox-panel--ask > .fox-ask', '.fox-panel--ask > .oracle-chat']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/oracle-knowledge.js',
              markers: ['circle-evidence', 'prime-per-instance', 'mapping-space',
                'wormhole-inverted-torus', 'baryogenesis-boundary', 'temporal-antipodes', 'little-red-dots-residue',
                'zero-seam-test', 'entropy-integration', 'double-inversion-residue',
                'differentials-mass-gravity', 'epistemic-grading']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/neural-voice.js',
              markers: ['NaturalVoiceEngine', 'MALE_NEURAL_VOICES', 'am_fenrir', 'bm_lewis',
                'voiceURL: new URL("voices/?v=male-voices-3", root).href', 'voices: MALE_NEURAL_VOICES.map',
                'message.data.voice !== selectedVoice', 'worker-tts.mjs?v=male-voices-3',
                'prepareOutput', 'audioTone', 'headtts/headtts.mjs',
                'generated privately on this device']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/headtts/headtts.mjs',
              markers: ['item.message.data.voice = (item.message.data.voice || this.ttsSetup.voice).slice()']
            },
            ...['bm_george', 'bm_fable', 'bm_lewis', 'am_fenrir', 'am_michael', 'am_puck'].map((voiceId) => ({
              url: `https://egregora.hatchable.site/assets/js/headtts/voices/${voiceId}.bin`,
              markers: [], minBytes: 500000, voiceId
            })),
            {
              url: 'https://egregora.hatchable.site/assets/js/headtts/worker-tts.mjs',
              markers: ['StyleTextToSpeech2Model', 'updateTimestamps', 'audioEncoding',
                'await loadVoice(x)', 'metadata.voice = d.voice']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/fox.js',
              markers: ['eg-gink-natural-voice', 'eg-gink-neural-male-voice',
                'naturalVoice.speak', 'naturalVoice.setVoice', 'naturalWanted = true',
                'voice audition', 'rankNativeVoices', 'microGaze', 'roundNow', 'const nostrils']
            }
          ];
          let detail = 'Gink did not become current';
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const checks = await Promise.all(targets.map(async (target) => {
                const response = await fetch(`${target.url}?deploy=${process.env.GITHUB_SHA || Date.now()}`, {
                  headers: { 'cache-control': 'no-cache' }
                });
                const body = await response.arrayBuffer();
                const text = target.markers.length ? new TextDecoder().decode(body) : '';
                const orderedPositions = (target.orderedMarkers || []).map((marker) => text.indexOf(marker));
                const ordered = orderedPositions.every((position, index) =>
                  position >= 0 && (index === 0 || position > orderedPositions[index - 1]));
                const voiceHash = target.voiceId
                  ? Buffer.from(await crypto.subtle.digest('SHA-256', body)).toString('hex')
                  : null;
                return {
                  target,
                  response,
                  voiceHash,
                  current: response.ok && body.byteLength >= (target.minBytes || 1) && ordered &&
                    target.markers.every((marker) => text.includes(marker))
                };
              }));
              const voiceChecks = checks.filter((check) => check.target.voiceId);
              const voicesDistinct = voiceChecks.length === 6 &&
                new Set(voiceChecks.map((check) => check.voiceHash)).size === 6;
              if (checks.every((check) => check.current) && voicesDistinct) {
                console.log('Live EGregoRA infographics, Gink chooser, six distinct embeddings, questions and prepared answers verified.');
                process.exit(0);
              }
              detail = checks.map((check) =>
                `${check.target.url} HTTP ${check.response.status}; current=${check.current}`).join(' | ') +
                ` | sixDistinctVoices=${voicesDistinct}`;
            } catch (error) {
              detail = error && error.message || String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 8000));
          }
          const safe = String(detail).replace(/%/g, '%25').replace(/\r/g, '%0D')
            .replace(/\n/g, '%0A').slice(0, 1200);
          console.log(`::error title=Live Gink knowledge verification failed::${safe}`);
          process.exit(1);
          NODE

      - name: Verify Möbius spelling on every live EGregoRA page
        run: node scripts/test-mobius-spelling.mjs --live

      - name: Verify moved essays resolve canonically to TTI
        run: node scripts/test-tti-relocations.mjs --live

      - name: Verify live private transcription, avatar summaries and active progress
        run: |
          node <<'NODE'
          const targets = [
            ['https://egregora.hatchable.site/podcast/', [
              'media-admin.js?v=avatar-summary-1', 'Transcribe privately, then write the summary',
              'Private local Whisper:', 'recording is never sent to a',
              'same AI and selected', 'chat model used by Gink and ShakDrah',
              'oracle&rsquo;s answers, podcast summaries, pictures and films',
              '@keyframes am-progress-sweep', '.am-bar.is-waiting'
            ]],
            ['https://egregora.hatchable.site/videos/', [
              'media-admin.js?v=avatar-summary-1'
            ]],
            ['https://egregora.hatchable.site/assets/js/media-admin.js', [
              'blobPartBase64', 'blob.slice(from, to).arrayBuffer()',
              'const pieces = Math.ceil(blob.size / raw)',
              '/assets/js/private-whisper/browser-whisper.js?v=private-whisper-1',
              './progress-live.js?v=progress-live-1', 'createProgressLiveness',
              'avatarAiChoice', 'window.EGFreeWants', 'free_model: wanted.chat',
              'free_slot: Number(wanted.slot)',
              'new module.BrowserWhisper', 'model: "whisper-base"'
            ]],
            ['https://egregora.hatchable.site/assets/js/progress-live.js', [
              'still working', 'elapsed', 'aria-valuetext', 'is-waiting'
            ]],
            ['https://egregora.hatchable.site/assets/js/private-whisper/browser-whisper.js', [
              'BrowserWhisper', 'whisper-base', 'onnx-community/whisper-base',
              'Origin Private File System'
            ]]
          ];
          let detail = 'the private transcription, avatar-summary and active-progress clients did not become current';
          for (let attempt = 0; attempt < 10; attempt += 1) {
            try {
              const results = await Promise.all(targets.map(async ([url, markers]) => {
                const response = await fetch(`${url}?deploy=${process.env.GITHUB_SHA || Date.now()}`, {
                  headers: { 'cache-control': 'no-cache' }
                });
                const text = await response.text();
                return { url, status: response.status,
                  ok: response.ok && markers.every((marker) => text.includes(marker)) };
              }));
              if (results.every((result) => result.ok)) {
                console.log('Live media pages use bounded uploads, private BrowserWhisper, the avatar AI choice, and elapsed-time progress heartbeats.');
                process.exit(0);
              }
              detail = results.map((result) =>
                `${result.url} HTTP ${result.status}; current=${result.ok}`).join(' | ');
            } catch (error) {
              detail = error && error.message || String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 8000));
          }
          const safe = String(detail).replace(/%/g, '%25').replace(/\r/g, '%0D')
            .replace(/\n/g, '%0A').slice(0, 1200);
          console.log(`::error title=Live private transcription and avatar-summary verification failed::${safe}`);
          process.exit(1);
          NODE

      - name: Verify the live speaker map and any private transcript
        run: |
          node <<'NODE'
          const report = (error) => {
            const message = String(error && error.message || error || 'unknown live verification error')
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1500);
            console.log(`::error title=Live transcript verification failed::${message}`);
            process.exit(1);
          };
          process.on('uncaughtException', report);
          process.on('unhandledRejection', report);

          const endpoint = 'https://egregora.hatchable.site/api/media';
          const post = async (body) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
          };

          let shelf;
          for (let attempt = 0; attempt < 6; attempt += 1) {
            try {
              shelf = await post({ action: 'list', kind: 'audio' });
              const latest = shelf.items && shelf.items.slice().sort((a, b) =>
                String(b.actual_created_at || '').localeCompare(String(a.actual_created_at || '')))[0];
              const names = new Map((latest && latest.speakers || []).map((s) => [s.number, s.name]));
              if (names.get(1) === 'Edward Gregory' && names.get(2) === 'Jim Rankin') break;
            } catch { /* allow the new deployment a moment to become live */ }
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }

          const latest = shelf && shelf.items && shelf.items.slice().sort((a, b) =>
            String(b.actual_created_at || '').localeCompare(String(a.actual_created_at || '')))[0];
          if (!latest) {
            console.log('::warning title=Live speaker-turn verification deferred::' +
              'The podcast shelf is empty; publish an episode to enable the content check.');
            process.exit(0);
          }
          const names = new Map((latest.speakers || []).map((s) => [s.number, s.name]));
          if (names.get(1) !== 'Edward Gregory' || names.get(2) !== 'Jim Rankin') {
            throw new Error('The latest podcast speaker map was not stored.');
          }
          if (!latest.has_transcript) {
            console.log('::warning title=Private podcast transcript pending::' +
              'The latest podcast has the declared Edward Gregory/Jim Rankin map. ' +
              'Private local transcription is still pending on an administrator device; deployment will not send its audio to a cloud STT service.');
            process.exit(0);
          }

          const heard = await post({ action: 'transcript', id: latest.id });
          if (!heard.transcript.includes('Edward Gregory') || !heard.transcript.includes('Jim Rankin')) {
            throw new Error('The live transcript did not display the two named voices.');
          }
          if (!heard.speaker_patterns_stored) {
            const samples = {};
            for (const block of heard.transcript.split(/\n\s*\n/).filter(Boolean)) {
              const turn = /\]\s+(.+?)\s+—\s*(.*)/s.exec(block);
              if (turn) samples[turn[1]] = (samples[turn[1]] || 0) +
                ((turn[2].match(/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g) || []).length);
            }
            throw new Error('The live transcript did not store both speech-pattern profiles; ' +
              'attributed word counts=' + JSON.stringify(samples));
          }
          const turns = heard.transcript.split(/\n\s*\n/).filter(Boolean);
          for (let index = 1; index < turns.length; index += 1) {
            const before = /\]\s+(.+?)\s+—/.exec(turns[index - 1]);
            const now = /\]\s+(.+?)\s+—/.exec(turns[index]);
            if (before && now && before[1] === now[1]) {
              throw new Error('A timestamp changed without a change of speaker.');
            }
          }
          console.log('Live transcript names, turn timestamps, and stored pattern profiles verified.');
          NODE

      - name: Verify the live consenting voiceprint controls
        run: |
          node <<'NODE'
          const fail = (reason) => {
            const message = String(reason && reason.message || reason || 'unknown voiceprint verification error')
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1400);
            console.log(`::error title=Live voiceprint verification failed::${message}`);
            process.exit(1);
          };
          const [page, admin, voiceprint] = await Promise.all([
            fetch('https://egregora.hatchable.site/podcast/'),
            fetch('https://egregora.hatchable.site/assets/js/media-admin.js?v=avatar-summary-1'),
            fetch('https://egregora.hatchable.site/assets/js/voiceprint.js')
          ]);
          const [html, adminText, voiceprintText] = await Promise.all([
            page.text(), admin.text(), voiceprint.text()
          ]);
          if (!page.ok || !html.includes('media-admin.js?v=avatar-summary-1') ||
              !html.includes('Transcribe privately, then write the summary') ||
              !html.includes('data-am="transcribe-callout"') ||
              !html.includes('data-am="transcribe-progress"')) {
            fail(`The podcast transcription-and-summary controls are stale (HTTP ${page.status}).`);
          }
          if (!admin.ok || !adminText.includes('Consenting voiceprints') ||
              !adminText.includes('every further enrolled voice') ||
              !adminText.includes('voiceprint-labels') ||
              !adminText.includes('tr-progress') ||
              !adminText.includes('transcribe-progress') ||
              !adminText.includes('Transcript and summary ready') ||
              !adminText.includes('Starting transcription')) {
            fail(`The biometric or transcription-progress controls are stale (HTTP ${admin.status}).`);
          }
          if (!voiceprint.ok || !voiceprintText.includes('AES-GCM') ||
              !voiceprintText.includes('assignVoiceprints')) {
            fail(`The local encrypted-template module is missing (HTTP ${voiceprint.status}).`);
          }
          const denied = await fetch('https://egregora.hatchable.site/api/media', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'voiceprints' })
          });
          const deniedData = await denied.json().catch(() => ({}));
          if (denied.ok || Array.isArray(deniedData.voiceprints)) {
            fail('Encrypted biometric templates were readable without the admin door.');
          }
          console.log('Live consent UI, transcription progress bars, AES-GCM module, and admin-only boundary verified.');
