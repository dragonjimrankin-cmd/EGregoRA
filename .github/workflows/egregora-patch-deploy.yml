            fail(`Date-enabled Admin Edit asset is stale (HTTP ${asset.status}).`);
          }

          const root = 'egregora-patch/public';
          const files = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.html')) files.push(file);
            }
          };
          walk(root);
          const expected = files.filter((file) => fs.readFileSync(file, 'utf8')
            .includes('/assets/js/admin-edit.js?v=creation-date-1'));
          const excluded = files.filter((file) => !expected.includes(file))
            .map((file) => path.relative(root, file).replaceAll(path.sep, '/')).sort();
          const allowedRelocationStubs = [
            'cosmic-ether/index.html', 'cosmic-ledger/index.html',
            'entropy/index.html', 'moebius-seam/index.html'
          ].sort();
          if (JSON.stringify(excluded) !== JSON.stringify(allowedRelocationStubs)) {
            fail(`Unexpected creation-date exclusions: ${excluded.join(', ') || 'none'}.`);
          }

          for (const file of expected) {
            const relative = path.relative(root, file).replaceAll(path.sep, '/');
            const route = relative === 'index.html' ? '/'
              : relative.endsWith('/index.html') ? '/' + relative.slice(0, -10)
                : '/' + relative;
            const page = await fetch('https://egregora.hatchable.site' + route);
            const html = await page.text();
            if (!page.ok || !html.includes('/assets/js/admin-edit.js?v=creation-date-1')) {
              fail(`${route} does not load the date-enabled Admin Edit asset (HTTP ${page.status}).`);
