name: Deploy EGregoRA patch

on:
  workflow_dispatch:
  push:
    branches:
      - arena/c016ca5c-egregora
    paths:
      - "egregora-patch/**"
      - "ops/egregora-project.txt"
      - "scripts/hatchable-deploy.mjs"
      - "scripts/test-voiceprint.mjs"
      - "scripts/test-neural-voice.mjs"
      - "scripts/test-oracle-knowledge.mjs"
      - ".github/workflows/egregora-patch-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HATCHABLE_TOKEN: ${{ secrets.HATCHABLE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate the patch
        run: |
          node --check egregora-patch/api/transcribe.js
          node --check egregora-patch/api/media.js
          node --check egregora-patch/api/edit.js
          node --check egregora-patch/pages/feed.js
          node --check egregora-patch/public/assets/js/media-admin.js
          node --check egregora-patch/public/assets/js/voiceprint.js
          node --check egregora-patch/public/assets/js/admin-edit.js
          node --check egregora-patch/public/assets/js/oracle-knowledge.js
          node --check egregora-patch/public/assets/js/neural-voice.js
          node --check egregora-patch/public/assets/js/fox.js
          node scripts/test-voiceprint.mjs
          node scripts/test-oracle-knowledge.mjs
          node scripts/test-neural-voice.mjs
          test -s egregora-patch/public/assets/js/headtts/worker-tts.mjs
          test -s egregora-patch/public/assets/js/headtts/dictionaries/en-us.txt
          grep -q 'Sixteen prepared answers' egregora-patch/public/ask-ed/index.html
          grep -q 'What is in The Channeling Circle transcript archive?' egregora-patch/public/ask-ed/index.html
          grep -q 'Natural voice: off' egregora-patch/public/ask-ed/index.html
          grep -q 'Answer text stays on this device' egregora-patch/public/ask-ed/index.html
          grep -q 'bm_fable' egregora-patch/public/assets/js/neural-voice.js
          node -e "const fs=require('fs'); const id=fs.readFileSync('ops/egregora-project.txt','utf8').trim(); if (!/^proj_[A-Za-z0-9]+$/.test(id)) process.exit(1)"

      - name: Deploy to the existing EGregoRA project
        run: |
          if [ -z "$HATCHABLE_TOKEN" ]; then
            echo "::error title=Hatchable deployment unavailable::HATCHABLE_TOKEN is not configured as a repository secret."
            exit 1
          fi

          PROJECT_ID=$(tr -d ' \n\r' < ops/egregora-project.txt)
          STATUS=1
          for ATTEMPT in 1 2 3 4 5 6; do
            set +e
            node scripts/hatchable-deploy.mjs \
              --bundle egregora-patch \
              --project "$PROJECT_ID" \
              --name "EGregoRA" \
              --slug egregora 2>&1 | tee /tmp/egregora-patch-deploy.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then break; fi
            if [ "$ATTEMPT" -lt 6 ] && grep -Eqi 'HTTP 429|Too Many Attempts' /tmp/egregora-patch-deploy.log; then
              WAIT=$((ATTEMPT * 30))
              echo "Hatchable is rate-limiting deployment; retrying in ${WAIT}s."
              sleep "$WAIT"
            else
              break
            fi
          done

          if [ "$STATUS" -ne 0 ]; then
            MESSAGE=$(tail -20 /tmp/egregora-patch-deploy.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' | cut -c1-1800)
            echo "::error title=EGregoRA patch deployment failed::$MESSAGE"
            exit "$STATUS"
          fi

      - name: Verify Gink's live prepared knowledge
        run: |
          node <<'NODE'
          const targets = [
            {
              url: 'https://egregora.hatchable.site/ask-ed/',
              markers: ['Sixteen prepared answers', 'What is in The Channeling Circle transcript archive?',
                'Can reversible mixing create a matter-antimatter imbalance?', 'oracle-knowledge.js',
                'Natural voice: off', 'Answer text stays on this device', 'fox.js?v=natural-voice-1']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/oracle-knowledge.js',
              markers: ['circle-evidence', 'prime-per-instance', 'mapping-space',
                'baryogenesis-boundary', 'epistemic-grading']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/neural-voice.js',
              markers: ['NaturalVoiceEngine', 'bm_george', 'bm_fable',
                'headtts/headtts.mjs', 'generated privately on this device']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/headtts/worker-tts.mjs',
              markers: ['StyleTextToSpeech2Model', 'updateTimestamps', 'audioEncoding']
            },
            {
              url: 'https://egregora.hatchable.site/assets/js/fox.js',
              markers: ['eg-gink-natural-voice', 'naturalVoice.speak', 'rankNativeVoices']
            }
          ];
          let detail = 'Gink did not become current';
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const checks = await Promise.all(targets.map(async (target) => {
                const response = await fetch(`${target.url}?deploy=${process.env.GITHUB_SHA || Date.now()}`, {
                  headers: { 'cache-control': 'no-cache' }
                });
                const text = await response.text();
                return {
                  target,
                  response,
                  current: response.ok && target.markers.every((marker) => text.includes(marker))
                };
              }));
              if (checks.every((check) => check.current)) {
                console.log('Live Gink questions and prepared answers verified.');
                process.exit(0);
              }
              detail = checks.map((check) =>
                `${check.target.url} HTTP ${check.response.status}; current=${check.current}`).join(' | ');
            } catch (error) {
              detail = error && error.message || String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 8000));
          }
          const safe = String(detail).replace(/%/g, '%25').replace(/\r/g, '%0D')
            .replace(/\n/g, '%0A').slice(0, 1200);
          console.log(`::error title=Live Gink knowledge verification failed::${safe}`);
          process.exit(1);
          NODE

      - name: Recover the named latest-podcast transcript
        run: |
          node <<'NODE'
          const response = await fetch('https://egregora.hatchable.site/api/media', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'bootstrap-speakers' })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.ok) {
            const message = String(data.error || `HTTP ${response.status}`)
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1000);
            console.log(`::warning title=Podcast speaker recovery unavailable::${message}`);
          } else if (!data.done) {
            const detail = `${data.status || 'not completed'}; shape=${(data.response_shape || []).join(',')}`;
            console.log(`::warning title=Podcast speaker recovery incomplete::${detail}`);
          } else {
            console.log(`Named podcast transcript recovery: ${data.status}; turns=${data.turns || 'existing'}.`);
          }
          NODE

      - name: Verify the live speaker turns
        run: |
          node <<'NODE'
          const report = (error) => {
            const message = String(error && error.message || error || 'unknown live verification error')
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1500);
            console.log(`::error title=Live transcript verification failed::${message}`);
            process.exit(1);
          };
          process.on('uncaughtException', report);
          process.on('unhandledRejection', report);

          const endpoint = 'https://egregora.hatchable.site/api/media';
          const post = async (body) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
            return data;
          };

          let shelf;
          for (let attempt = 0; attempt < 6; attempt += 1) {
            try {
              shelf = await post({ action: 'list', kind: 'audio' });
              const latest = shelf.items && shelf.items.slice().sort((a, b) =>
                String(b.actual_created_at || '').localeCompare(String(a.actual_created_at || '')))[0];
              const names = new Map((latest && latest.speakers || []).map((s) => [s.number, s.name]));
              if (names.get(1) === 'Edward Gregory' && names.get(2) === 'Jim Rankin') break;
            } catch { /* allow the new deployment a moment to become live */ }
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }

          const latest = shelf && shelf.items && shelf.items.slice().sort((a, b) =>
            String(b.actual_created_at || '').localeCompare(String(a.actual_created_at || '')))[0];
          if (!latest) throw new Error('The live podcast shelf is empty.');
          const names = new Map((latest.speakers || []).map((s) => [s.number, s.name]));
          if (names.get(1) !== 'Edward Gregory' || names.get(2) !== 'Jim Rankin') {
            throw new Error('The latest podcast speaker map was not stored.');
          }
          if (!latest.has_transcript) {
            throw new Error('The latest podcast still has no stored transcript after guarded recovery.');
          }

          const heard = await post({ action: 'transcript', id: latest.id });
          if (!heard.transcript.includes('Edward Gregory') || !heard.transcript.includes('Jim Rankin')) {
            throw new Error('The live transcript did not display the two named voices.');
          }
          if (!heard.speaker_patterns_stored) {
            const samples = {};
            for (const block of heard.transcript.split(/\n\s*\n/).filter(Boolean)) {
              const turn = /\]\s+(.+?)\s+—\s*(.*)/s.exec(block);
              if (turn) samples[turn[1]] = (samples[turn[1]] || 0) +
                ((turn[2].match(/[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*/g) || []).length);
            }
            throw new Error('The live transcript did not store both speech-pattern profiles; ' +
              'attributed word counts=' + JSON.stringify(samples));
          }
          const turns = heard.transcript.split(/\n\s*\n/).filter(Boolean);
          for (let index = 1; index < turns.length; index += 1) {
            const before = /\]\s+(.+?)\s+—/.exec(turns[index - 1]);
            const now = /\]\s+(.+?)\s+—/.exec(turns[index]);
            if (before && now && before[1] === now[1]) {
              throw new Error('A timestamp changed without a change of speaker.');
            }
          }
          console.log('Live transcript names, turn timestamps, and stored pattern profiles verified.');
          NODE

      - name: Verify the live consenting voiceprint controls
        run: |
          node <<'NODE'
          const fail = (reason) => {
            const message = String(reason && reason.message || reason || 'unknown voiceprint verification error')
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1400);
            console.log(`::error title=Live voiceprint verification failed::${message}`);
            process.exit(1);
          };
          const [page, admin, voiceprint] = await Promise.all([
            fetch('https://egregora.hatchable.site/podcast/'),
            fetch('https://egregora.hatchable.site/assets/js/media-admin.js?v=transcription-summary-2'),
            fetch('https://egregora.hatchable.site/assets/js/voiceprint.js')
          ]);
          const [html, adminText, voiceprintText] = await Promise.all([
            page.text(), admin.text(), voiceprint.text()
          ]);
          if (!page.ok || !html.includes('media-admin.js?v=transcription-summary-2') ||
              !html.includes('Transcribe it, then write the summary') ||
              !html.includes('data-am="transcribe-callout"') ||
              !html.includes('data-am="transcribe-progress"')) {
            fail(`The podcast transcription-and-summary controls are stale (HTTP ${page.status}).`);
          }
          if (!admin.ok || !adminText.includes('Consenting voiceprints') ||
              !adminText.includes('every further enrolled voice') ||
              !adminText.includes('voiceprint-labels') ||
              !adminText.includes('tr-progress') ||
              !adminText.includes('transcribe-progress') ||
              !adminText.includes('Transcript and summary ready') ||
              !adminText.includes('Starting transcription')) {
            fail(`The biometric or transcription-progress controls are stale (HTTP ${admin.status}).`);
          }
          if (!voiceprint.ok || !voiceprintText.includes('AES-GCM') ||
              !voiceprintText.includes('assignVoiceprints')) {
            fail(`The local encrypted-template module is missing (HTTP ${voiceprint.status}).`);
          }
          const denied = await fetch('https://egregora.hatchable.site/api/media', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'voiceprints' })
          });
          const deniedData = await denied.json().catch(() => ({}));
          if (denied.ok || Array.isArray(deniedData.voiceprints)) {
            fail('Encrypted biometric templates were readable without the admin door.');
          }
          console.log('Live consent UI, transcription progress bars, AES-GCM module, and admin-only boundary verified.');
          NODE

      - name: Verify the live creation-date controls
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const fail = (reason) => {
            const message = String(reason && reason.message || reason || 'unknown date verification error')
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').slice(0, 1400);
            console.log(`::error title=Live creation-date verification failed::${message}`);
            process.exit(1);
          };
          const response = await fetch('https://egregora.hatchable.site/api/edit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: 'date', page: '/' })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.ok || data.page !== '/' || typeof data.date !== 'string') {
            fail(data.error || `date endpoint HTTP ${response.status}`);
          }

          const asset = await fetch('https://egregora.hatchable.site/assets/js/admin-edit.js?v=creation-date-1');
          const assetText = await asset.text();
          if (!asset.ok || !assetText.includes('ae-date-save') ||
              !assetText.includes('purported creation date')) {
            fail(`Date-enabled Admin Edit asset is stale (HTTP ${asset.status}).`);
          }

          const root = 'egregora-patch/public';
          const files = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (entry.name.endsWith('.html')) files.push(file);
            }
          };
          walk(root);
          const expected = files.filter((file) => fs.readFileSync(file, 'utf8')
            .includes('/assets/js/admin-edit.js?v=creation-date-1'));
          if (expected.length !== 32) fail(`Expected 32 date-enabled generated pages, found ${expected.length}.`);

          for (const file of expected) {
            const relative = path.relative(root, file).replaceAll(path.sep, '/');
            const route = relative === 'index.html' ? '/'
              : relative.endsWith('/index.html') ? '/' + relative.slice(0, -10)
                : '/' + relative;
            const page = await fetch('https://egregora.hatchable.site' + route);
            const html = await page.text();
            if (!page.ok || !html.includes('/assets/js/admin-edit.js?v=creation-date-1')) {
              fail(`${route} does not load the date-enabled Admin Edit asset (HTTP ${page.status}).`);
            }
          }
          console.log(`Live creation-date endpoint, asset, and all ${expected.length} applicable pages verified.`);
          NODE
