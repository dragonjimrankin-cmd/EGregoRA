name: Probe free model routes
on:
  workflow_dispatch:
  push:
    branches: ["arena/01a10807-egregora"]
    paths:
      - "scripts/model-probe.mjs"
      - ".github/workflows/model-probe.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Probe
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          node scripts/model-probe.mjs > ci-logs/model-probe.log 2>&1
          tail -120 ci-logs/model-probe.log
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -w0 ci-logs/model-probe.log)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/ci-logs/model-probe.log?ref=${GITHUB_REF_NAME}" -q .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/model-probe.log" -f message="ci: model probe" -f content="$B64" -f branch="${GITHUB_REF_NAME}" -f sha="$SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/ci-logs/model-probe.log" -f message="ci: model probe" -f content="$B64" -f branch="${GITHUB_REF_NAME}"
          fi
